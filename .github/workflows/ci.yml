name: SmartFresh regression and release evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AI_PROVIDER: OpenAI
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: JavaScript syntax
        shell: bash
        run: for f in web/*.js; do node --check "$f" || exit 1; done
      - name: Regression, end-to-end and release evidence
        run: python scripts/run_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.os }}
          path: |
            docs/GD9_QA_RESULTS.json
            docs/GD9_E2E_RESULTS.json
            docs/GD9_pytest.xml
            release_manifest.json
